<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>一級建築士 設計製図 対策</title>
<meta name="description" content="一級建築士 設計製図試験の対策アプリ。計画の要点等（記述）を設問形式で演習し、キーワードの網羅を自動判定します。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b212b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="設計製図">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23155e52'/%3E%3Cpath d='M14 46 L14 16 L40 16' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M24 26 H50 V50 H24 Z' fill='none' stroke='%23fff' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#f8fafc; --line:#dfe5ec;
  --tx:#1a2230; --tx2:#5a6779; --tx3:#8a94a4;
  --acc:#155e52; --acc2:#1d7d6c; --accbg:#e4f1ee;
  --ok:#1a7f4b; --okbg:#e6f4ec; --ng:#c0392b; --ngbg:#fceceb;
  --warn:#b7791f; --warnbg:#fdf6e3;
  --mark:#ffe9a8; --marktx:#5c4508;
  --sh:0 1px 3px rgba(20,35,60,.08),0 6px 18px rgba(20,35,60,.06);
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12161d; --panel:#1b212b; --panel2:#222a36; --line:#333d4c;
    --tx:#e8edf4; --tx2:#a8b3c2; --tx3:#7c8899;
    --acc:#5fbfa9; --acc2:#7fd4c0; --accbg:#16302b;
    --ok:#5bc48b; --okbg:#163023; --ng:#f08a80; --ngbg:#37201e;
    --warn:#e0b458; --warnbg:#332a16;
    --mark:#5a4a18; --marktx:#ffe9a8;
    --sh:0 1px 3px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  background:var(--bg);color:var(--tx);line-height:1.75;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}

header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.hd{display:flex;align-items:center;gap:12px;height:56px}
.logo{font-weight:800;font-size:16px;letter-spacing:.02em;color:var(--acc);white-space:nowrap}
.logo small{display:block;font-size:10px;font-weight:600;color:var(--tx3);letter-spacing:.14em}
.hd-sp{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:19px;
  padding:4px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.timer.warn{color:var(--warn);background:var(--warnbg);border-color:var(--warn)}
.timer.danger{color:#fff;background:var(--ng);border-color:var(--ng);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
.hbtn{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
  font-size:13px;font-weight:700;color:var(--tx2)}
.hbtn:hover{background:var(--accbg);color:var(--acc);border-color:var(--acc)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin:16px 0}
h2.sec{font-size:15px;font-weight:800;letter-spacing:.04em;color:var(--acc);margin:26px 0 10px;
  display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:4px;height:16px;background:var(--acc);border-radius:2px}
.muted{color:var(--tx2);font-size:13px}
.tiny{font-size:12px;color:var(--tx3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:10px;font-weight:800;font-size:15px;
  background:var(--acc);color:#fff;box-shadow:0 2px 8px rgba(21,94,82,.25);transition:.15s}
.btn:hover{background:var(--acc2);transform:translateY(-1px)}
.btn.sub{background:var(--panel2);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.sub:hover{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap}

.hero{background:linear-gradient(135deg,#10443c 0%,#155e52 60%,#1d7d6c 100%);
  color:#fff;border-radius:var(--r);padding:26px 24px;margin:18px 0;box-shadow:var(--sh)}
.hero h1{font-size:22px;font-weight:800;margin-bottom:6px}
.hero p{font-size:13px;opacity:.9;line-height:1.7}
.hero .stats{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.hero .stats div{font-size:11px;opacity:.85;letter-spacing:.08em}
.hero .stats b{display:block;font-size:22px;font-weight:800;letter-spacing:0;opacity:1}

/* ---------- トップ：課題メイン ---------- */
.kv{background:linear-gradient(135deg,#0f2f45 0%,#155e52 55%,#1d7d6c 100%);color:#fff;
  border-radius:var(--r);padding:28px 26px 24px;margin:18px 0 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kv::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.06)}
.kv .lbl{font-size:12px;font-weight:800;letter-spacing:.16em;opacity:.85}
.kv .ttl{font-size:34px;font-weight:900;letter-spacing:.04em;margin:6px 0 4px;line-height:1.25}
.kv .ttl small{font-size:18px;font-weight:800;opacity:.85;margin-right:4px}
.kv .sub{font-size:13px;opacity:.9}
.kv .cd{display:inline-flex;align-items:baseline;gap:6px;margin-top:14px;padding:7px 16px;border-radius:24px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);font-size:13px;font-weight:800}
.kv .cd b{font-size:24px;font-variant-numeric:tabular-nums}
.kv .src{font-size:11px;opacity:.7;margin-top:12px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.kcard{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;padding:18px;
  background:var(--panel);border:2px solid var(--acc);border-radius:var(--r);box-shadow:var(--sh);transition:.15s}
.kcard:hover{transform:translateY(-2px);background:var(--accbg)}
.kcard .no{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--acc)}
.kcard .nm{font-size:17px;font-weight:900;line-height:1.45}
.kcard .spec{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.kcard .spec span{font-size:11px;font-weight:700;color:var(--tx2);background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.kcard .go{margin-top:auto;padding-top:8px;font-size:13px;font-weight:800;color:var(--acc)}
.kcard .pr{font-size:11.5px;color:var(--tx3)}
.minist{display:flex;gap:10px;flex-wrap:wrap}
.minist div{flex:1;min-width:110px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.minist div span{display:block;font-size:11px;font-weight:700;color:var(--tx3)}
.minist div b{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
@media(max-width:600px){ .kv{padding:22px 18px 20px} .kv .ttl{font-size:27px} }

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;
  text-align:left;box-shadow:var(--sh);transition:.15s;display:block;width:100%}
.mode:hover{border-color:var(--acc);transform:translateY(-2px)}
.mode .ic{font-size:22px;margin-bottom:6px}
.mode h3{font-size:15px;font-weight:800;margin-bottom:4px}
.mode p{font-size:12px;color:var(--tx2);line-height:1.6}
.mode .tag{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;
  background:var(--accbg);color:var(--acc);padding:2px 8px;border-radius:20px}
.mode.soon{opacity:.55}
.mode.soon:hover{border-color:var(--line);transform:none}

.catlist{display:grid;gap:8px}
.catrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel);width:100%;text-align:left;transition:.15s}
.catrow:hover{border-color:var(--acc);background:var(--accbg)}
.catrow .nm{font-weight:800;font-size:14px;min-width:150px}
.catrow .bar{flex:1;height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.catrow .bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.catrow .pc{font-size:12px;font-weight:800;color:var(--tx2);min-width:78px;text-align:right;font-variant-numeric:tabular-nums}

.chip{font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;background:var(--accbg);color:var(--acc)}
.chip.g{background:var(--panel2);color:var(--tx2);border:1px solid var(--line)}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.qno{font-size:13px;font-weight:800;color:var(--tx3);font-variant-numeric:tabular-nums}
.qtext{font-size:16px;font-weight:700;line-height:1.85;margin-bottom:8px}
.qcond{font-size:12.5px;color:var(--tx2);background:var(--panel2);border-left:3px solid var(--acc);
  padding:9px 13px;border-radius:0 8px 8px 0;margin-bottom:14px;line-height:1.7}

textarea{width:100%;min-height:150px;padding:14px;border:2px solid var(--line);border-radius:10px;
  background:var(--panel2);color:var(--tx);font-family:inherit;font-size:14.5px;line-height:1.9;resize:vertical}
textarea:focus{outline:none;border-color:var(--acc);background:var(--panel)}
.cnt{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--tx3)}
.cnt b{font-size:16px;font-variant-numeric:tabular-nums;color:var(--tx2)}
.cnt .ok{color:var(--ok)} .cnt .over{color:var(--warn)}

.scorebox{display:flex;align-items:center;gap:18px;padding:16px 18px;border-radius:var(--r);
  color:#fff;margin-bottom:4px;flex-wrap:wrap}
.scorebox.a{background:linear-gradient(135deg,#12784a,#1a9d61)}
.scorebox.b{background:linear-gradient(135deg,#a9741a,#c99433)}
.scorebox.c{background:linear-gradient(135deg,#9b3226,#c0453a)}
.scorebox .rk{font-size:32px;font-weight:900;line-height:1}
.scorebox .dt{flex:1;min-width:180px}
.scorebox .dt b{font-size:15px;display:block}
.scorebox .dt span{font-size:12.5px;opacity:.9}

.kwlist{display:grid;gap:7px;margin-top:4px}
.kwrow{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);font-size:13.5px}
.kwrow.hit{border-color:var(--ok);background:var(--okbg)}
.kwrow.miss{border-color:var(--ng);background:var(--ngbg)}
.kwrow .mk{font-weight:900;font-size:14px;flex:0 0 auto}
.kwrow.hit .mk{color:var(--ok)} .kwrow.miss .mk{color:var(--ng)}
.kwrow .bd{flex:1}
.kwrow .bd b{font-weight:800}
.kwrow .syn{font-size:11.5px;color:var(--tx3);display:block;margin-top:2px}

.ansbox{padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
  font-size:14px;line-height:1.95;white-space:pre-wrap}
.ansbox.model{border-left:3px solid var(--ok);background:var(--okbg)}
mark{background:var(--mark);color:var(--marktx);padding:1px 2px;border-radius:3px;font-weight:700}
h4.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--tx3);margin:18px 0 7px;
  padding-bottom:4px;border-bottom:1px dashed var(--line)}
.tipbox{background:var(--warnbg);border:1px solid var(--warn);border-radius:9px;padding:12px 14px;font-size:13.5px;line-height:1.85}

.setlist{display:grid;gap:8px}
.setrow{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel);width:100%;text-align:left;font-size:13px}
.setrow:hover{border-color:var(--acc);background:var(--accbg)}
.setrow .mk{flex:0 0 26px;height:26px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-weight:900;font-size:13px}
.setrow .mk.a{background:var(--okbg);color:var(--ok)}
.setrow .mk.b{background:var(--warnbg);color:var(--warn)}
.setrow .mk.c{background:var(--ngbg);color:var(--ng)}
.setrow .qq{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2)}

.hrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel);font-size:13px}
.hrow .dt{font-size:11.5px;color:var(--tx3);min-width:104px;font-variant-numeric:tabular-nums}
.hrow .md{font-weight:700;flex:1}
.hrow .sc{font-weight:800;font-variant-numeric:tabular-nums}

.empty{text-align:center;padding:44px 20px;color:var(--tx3);font-size:13.5px}
.empty .ic{font-size:36px;opacity:.4;margin-bottom:10px}
.hidden{display:none!important}
.notice{font-size:11.5px;color:var(--tx3);line-height:1.75;padding:14px 16px;background:var(--panel2);
  border:1px dashed var(--line);border-radius:10px;margin:20px 0}
footer{text-align:center;padding:30px 16px 10px;color:var(--tx3);font-size:11px;line-height:1.9}

/* ---------- エスキス検算 ---------- */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11.5px;font-weight:800;color:var(--tx3);letter-spacing:.04em}
.fld input,.fld select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel2);color:var(--tx);font-family:inherit;font-size:14px;width:100%}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--acc);background:var(--panel)}
.fld .hint{font-size:10.5px;color:var(--tx3);line-height:1.5}

.jgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.jcard{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel2)}
.jcard .t{font-size:11.5px;font-weight:800;color:var(--tx3);letter-spacing:.06em;margin-bottom:5px}
.jcard .v{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.jcard .v small{font-size:13px;font-weight:800;margin-left:2px}
.jcard .d{font-size:11.5px;color:var(--tx3);margin-top:7px;line-height:1.65}
.jcard.ok{border-color:var(--ok);background:var(--okbg)}
.jcard.ok .v{color:var(--ok)}
.jcard.ng{border-color:var(--ng);background:var(--ngbg)}
.jcard.ng .v{color:var(--ng)}
.jcard.wa{border-color:var(--warn);background:var(--warnbg)}
.jcard.wa .v{color:var(--warn)}

.rtbl{width:100%;border-collapse:collapse;font-size:13px}
.rtbl th{font-size:10.5px;color:var(--tx3);font-weight:800;letter-spacing:.04em;
  padding:8px 5px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.rtbl td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.rtbl input,.rtbl select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel2);color:var(--tx);font-family:inherit;font-size:13px}
.rtbl input:focus,.rtbl select:focus{outline:none;border-color:var(--acc);background:var(--panel)}
.rtbl input.num{text-align:right;font-variant-numeric:tabular-nums}
.rtbl .del{color:var(--ng);font-weight:900;font-size:16px;padding:2px 8px;line-height:1}
.rtbl tfoot td{border-bottom:none;padding-top:10px;font-weight:800}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tblwrap .rtbl{min-width:520px}

.gauge{height:24px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);
  position:relative;overflow:hidden;margin:6px 0 4px}
.gauge i{display:block;height:100%;transition:width .2s}
.gauge i.ok{background:var(--ok)} .gauge i.ng{background:var(--ng)} .gauge i.wa{background:var(--warn)}
.gauge span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:800;color:var(--tx);text-shadow:0 0 4px var(--panel)}

.chk{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel2);cursor:pointer;font-size:13px;font-weight:700}
.chk input{width:16px;height:16px;accent-color:var(--acc)}
.alert{border-radius:10px;padding:12px 15px;font-size:13px;line-height:1.75;margin-top:10px;font-weight:700}
.alert.ng{background:var(--ngbg);border:1px solid var(--ng);color:var(--ng)}
.alert.wa{background:var(--warnbg);border:1px solid var(--warn);color:var(--warn)}
.alert.ok{background:var(--okbg);border:1px solid var(--ok);color:var(--ok)}

/* ---------- 工程タイマー ---------- */
.tmrun{text-align:center;padding:26px 20px}
.tmrun .grp{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--tx3)}
.tmrun .ph{font-size:18px;font-weight:900;color:var(--acc);margin-top:4px;line-height:1.4}
.tmrun .big{font-size:74px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;margin:12px 0 6px;letter-spacing:-.02em}
.tmrun .big.warn{color:var(--warn)} .tmrun .big.danger{color:var(--ng);animation:blink 1s infinite}
.tmrun .sub{font-size:13.5px;color:var(--tx2);font-weight:700}
.tmrun .lag{display:inline-block;margin-top:14px;padding:7px 18px;border-radius:20px;font-weight:800;font-size:14px}
.tmrun .lag.ok{background:var(--okbg);color:var(--ok)}
.tmrun .lag.ng{background:var(--ngbg);color:var(--ng)}
.tmbtn{width:100%;padding:22px;font-size:19px;font-weight:900;border-radius:14px;
  background:var(--acc);color:#fff;margin-top:6px;box-shadow:0 3px 12px rgba(21,94,82,.3)}
.tmbtn:hover{background:var(--acc2)}
.tmbtn.fin{background:var(--warn);box-shadow:0 3px 12px rgba(183,121,31,.3)}
.steps{display:grid;gap:4px}
.step{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;
  background:var(--panel2);border:1px solid transparent}
.step.now{background:var(--accbg);border-color:var(--acc);font-weight:800}
.step.done{opacity:.5}
.step .t{flex:1;text-align:left}
.step .m{font-variant-numeric:tabular-nums;color:var(--tx3);font-size:12px;white-space:nowrap}
.step .m b{color:var(--tx2)}
.diff{font-variant-numeric:tabular-nums;font-weight:800}
.diff.plus{color:var(--ng)} .diff.minus{color:var(--ok)}
@media(max-width:600px){ .tmrun .big{font-size:58px} .tmrun{padding:20px 12px} }

/* ---------- 提出前チェックリスト ---------- */
.ckitem{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel);cursor:pointer;transition:.12s;width:100%;text-align:left}
.ckitem:hover{border-color:var(--acc)}
.ckitem.on{border-color:var(--ok);background:var(--okbg)}
.ckitem.on .bd b{text-decoration:line-through;opacity:.65}
.ckitem .bx{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:transparent;margin-top:2px}
.ckitem.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.ckitem .bd{flex:1}
.ckitem .bd b{font-size:14px;font-weight:800;display:block;line-height:1.6}
.ckitem .bd .d{font-size:12px;color:var(--tx2);margin-top:4px;line-height:1.7}
.lv{font-size:10px;font-weight:900;padding:2px 7px;border-radius:5px;letter-spacing:.04em;
  white-space:nowrap;flex:0 0 auto;margin-top:3px}
.lv.f{background:var(--ngbg);color:var(--ng)}

const pct=(a,b)=>b?Math.round(a/b*100):0;
const mmss=s=>{s=Math.max(0,s|0);return (s/60|0)+":"+String(s%60).padStart(2,"0");};

/* 照合用の正規化：空白・句読点を除き、英字は小文字化、全角英数は半角へ */
function norm(s){
  return String(s)
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[\s、。，．・「」（）()【】〔〕,.]/g,"")
    .toLowerCase();
}
/* キーワード群が解答に含まれるか（同義語のいずれか1つでヒット） */
function hitOf(group,answer){
  const a=norm(answer);
  for(let i=1;i<group.length;i++){ if(a.includes(norm(group[i]))) return group[i]; }
  return null;
}
function grade(q,answer){
  const mh=q.m.map(g=>({g,hit:hitOf(g,answer)}));
  const ph=q.p.map(g=>({g,hit:hitOf(g,answer)}));
  const mn=mh.filter(x=>x.hit).length, pn=ph.filter(x=>x.hit).length;
  const rate=pct(mn,q.m.length);
  const rank = rate>=80?"A" : rate>=50?"B" : "C";
  return {mh,ph,mn,pn,rate,rank,len:[...answer.trim()].length};
}

    本アプリは、設問ごとに定めた必須キーワードが解答に含まれているかを機械的に判定します。
    表現が模範解答例と違っていても、観点さえ押さえていれば問題ありません。
    逆に、キーワードが揃っていても文意が通っていなければ本番では点になりませんので、
    判定はあくまで「抜け漏れの検出器」として使ってください。

/* ============================================================
   演習の開始
   ============================================================ */
function screenCat(){
  clearChrome(); window.scrollTo(0,0);
  app.innerHTML=`<h2 class="sec">分野を選ぶ</h2>
  <div class="card"><div class="catlist">
   ${CATS.map(c=>{const qs=byC(c);
     return `<button class="catrow" onclick="startCat('${c}')">
       <span class="nm">${c}</span>
       <span class="bar"><i style="width:${(()=>{const ds=qs.filter(q=>STATS[q.id]);return ds.length?Math.round(ds.reduce((x,q)=>x+STATS[q.id].best,0)/ds.length):0;})()}%"></i></span>
       <span class="pc">${qs.length}問</span></button>`;}).join("")}
  </div></div>
  <div class="row" style="justify-content:center;margin:20px 0 40px">
    <button class="btn sub" onclick="home()">ホームへ戻る</button></div>`;
}
function startCat(c){ start(shuffle(byC(c)),c,false); }
function startSet(){
  // 分野が偏らないよう各分野から順に選ぶ
  const pools=CATS.map(c=>shuffle(byC(c)));
  const list=[]; let i=0;
  while(list.length<SET_N){ const p=pools[i%pools.length]; if(p.length) list.push(p.shift()); i++; }
  start(shuffle(list),"通し演習",true);
}
function start(list,title,timed){
  S={list,title,idx:0,ans:{},res:{},timed,tleft:timed?SET_MIN*60:0};
  if(timed) runTimer();
  renderQ();
}
function runTimer(){
  stopTimer();
  const el=$("#timer"); el.classList.remove("hidden");
  const upd=()=>{
    el.textContent=mmss(S.tleft);
    el.className="timer"+(S.tleft<=60?" danger":S.tleft<=300?" warn":"");
    if(S.tleft<=0){ stopTimer(); alert("制限時間になりました。ここまでの解答で採点します。"); finish(); return; }
    S.tleft--;
  };
  upd(); tick=setInterval(upd,1000);
}

/* ============================================================
   出題画面
   ============================================================ */
function renderQ(){
  const q=S.list[S.idx];
  const saved = S.ans[S.idx] ?? DRAFT[q.id] ?? "";
  const graded = S.res[S.idx];
  window.scrollTo(0,0);
  app.innerHTML=`
   <div class="card">
     <div class="qmeta">
       <span class="qno">設問 ${S.idx+1} / ${S.list.length}</span>
       <span class="chip">${esc(q.c)}</span>
       <span class="chip g">${esc(q.t)}</span>
       <span class="chip g">目安 ${q.n[0]}〜${q.n[1]}字</span>
     </div>
     <div class="qtext">${esc(q.q)}</div>
     ${q.cond?`<div class="qcond"><b>［設計条件］</b>${esc(q.cond)}</div>`:""}
     ${graded?"":`
       <textarea id="ta" placeholder="ここに解答を記述します。手書きの本番を想定して、${q.n[0]}〜${q.n[1]}字程度でまとめてください。">${esc(saved)}</textarea>
       <div class="cnt"><b id="cc">0</b>字　<span id="cj"></span>
         <span style="flex:1"></span>
         <span class="tiny">目安 ${q.n[0]}〜${q.n[1]}字</span></div>
       <div class="row" style="margin-top:14px">
         <button class="btn" onclick="submit()">採点する</button>
         <button class="btn sub" onclick="giveup()">分からないので解答例を見る</button>
       </div>`}
     ${graded?resultHTML(q,S.ans[S.idx],graded):""}
   </div>
   ${graded?`<div class="row" style="justify-content:center;margin:20px 0 40px">
      ${S.idx<S.list.length-1
        ? `<button class="btn" onclick="next()">次の設問へ（残り${S.list.length-S.idx-1}問）</button>`
        : `<button class="btn" onclick="finish()">結果を見る</button>`}
      <button class="btn sub" onclick="retry()">同じ設問をもう一度書く</button>
     </div>`:""}`;
  const ta=$("#ta");
  if(ta){
    const upd=()=>{
      const n=[...ta.value.trim()].length;
      $("#cc").textContent=n;
      const j=$("#cj");
      if(n===0){ j.textContent=""; }
      else if(n<q.n[0]){ j.textContent="（やや短い）"; j.className=""; }
      else if(n<=q.n[1]){ j.textContent="（適量）"; j.className="ok"; }
      else { j.textContent="（やや長い）"; j.className="over"; }
    };
    ta.addEventListener("input",upd); upd(); ta.focus();
  }
}
function submit(){
  const q=S.list[S.idx], v=$("#ta").value;
  if(![...v.trim()].length){ alert("解答を記述してから採点してください。"); return; }
  S.ans[S.idx]=v; S.res[S.idx]=grade(q,v);
  DRAFT[q.id]=v; LS.set("seizu_draft",DRAFT);
  const t=STATS[q.id]||(STATS[q.id]={n:0,best:0});
  t.n++; t.best=Math.max(t.best,S.res[S.idx].rate);
  LS.set("seizu_stats",STATS);
  renderQ();
}
function giveup(){
  const q=S.list[S.idx];
  S.ans[S.idx]=$("#ta").value||"";
  S.res[S.idx]=grade(q,S.ans[S.idx]);
  const t=STATS[q.id]||(STATS[q.id]={n:0,best:0});
  t.n++; LS.set("seizu_stats",STATS);
  renderQ();
}
function retry(){ delete S.res[S.idx]; renderQ(); }
function next(){ S.idx++; renderQ(); }

/* ============================================================
   判定結果の表示
   ============================================================ */
function markup(text,res){
  // 自分の解答の中でヒットした語を強調表示
  let h=esc(text);
  const words=[...res.mh,...res.ph].filter(x=>x.hit).map(x=>x.hit)
    .sort((a,b)=>b.length-a.length);
  words.forEach(w=>{
    const e=esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    h=h.replace(new RegExp(e,"g"),m=>""+m+"");
  });
  return h.replace(//g,"<mark>").replace(//g,"</mark>");
}
function resultHTML(q,answer,r){
  const [ttl,msg]=RANKTXT[r.rank];
  const lenNote = r.len<q.n[0] ? `字数が目安より少なめです（${r.len}字／目安${q.n[0]}〜${q.n[1]}字）。観点を1つ足せる余地があります。`
                : r.len>q.n[1] ? `字数が目安より多めです（${r.len}字／目安${q.n[0]}〜${q.n[1]}字）。本番は手書きなので、簡潔にまとめる練習をしましょう。`
                : `字数は適量です（${r.len}字）。`;
  return `
  <div style="margin-top:20px">
   <div class="scorebox ${r.rank.toLowerCase()}">
     <div class="rk">${r.rank}</div>
     <div class="dt"><b>必須キーワード ${r.mn}／${q.m.length} 　網羅率 ${r.rate}%</b>
       <span>${esc(ttl)}　加点キーワード ${r.pn}／${q.p.length}</span></div>
   </div>
   <p class="tiny" style="margin:8px 2px 0">${esc(msg)}${esc(lenNote)}</p>

   <h4 class="lbl">必須キーワードの網羅状況</h4>
   <div class="kwlist">
     ${r.mh.map(x=>`<div class="kwrow ${x.hit?'hit':'miss'}">
       <span class="mk">${x.hit?'○':'×'}</span>
       <span class="bd"><b>${esc(x.g[0])}</b>${x.hit?`　<span class="tiny">「${esc(x.hit)}」を検出</span>`:""}
         <span class="syn">認識される語：${x.g.slice(1).map(esc).join(" ／ ")}</span></span>
     </div>`).join("")}
   </div>

   <h4 class="lbl">加点キーワード（書けるとさらに良い観点）</h4>
   <div class="kwlist">
     ${r.ph.map(x=>`<div class="kwrow ${x.hit?'hit':''}">
       <span class="mk" style="${x.hit?'':'color:var(--tx3)'}">${x.hit?'○':'−'}</span>
       <span class="bd"><b>${esc(x.g[0])}</b>
         <span class="syn">認識される語：${x.g.slice(1).map(esc).join(" ／ ")}</span></span>
     </div>`).join("")}
   </div>

   ${[...answer.trim()].length?`<h4 class="lbl">あなたの解答（検出された語を強調）</h4>
   <div class="ansbox">${markup(answer.trim(),r)}</div>`:""}

   <h4 class="lbl">模範解答例</h4>
   <div class="ansbox model">${esc(q.a)}</div>

   <h4 class="lbl">書き方のポイント</h4>
   <div class="tipbox">${esc(q.tip)}</div>
  </div>`;
}

/* ============================================================
   結果（通し演習・分野別の終了時）
   ============================================================ */
function finish(){
  if(!S) return;
  stopTimer();
  const done=Object.keys(S.res).map(Number);
  if(!done.length){ home(); return; }
  const rates=done.map(i=>S.res[i].rate);
  const avg=Math.round(rates.reduce((a,b)=>a+b,0)/rates.length);
  const rank= avg>=80?"A" : avg>=50?"B" : "C";
  const perCat={};
  done.forEach(i=>{const c=S.list[i].c;(perCat[c]=perCat[c]||[]).push(S.res[i].rate);});

  HIST.unshift({date:new Date().toLocaleString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}),
    mode:S.title,n:done.length,avg});
  HIST=HIST.slice(0,50); LS.set("seizu_hist",HIST);

  const list=S.list, res=S.res, ans=S.ans;
  S=null; clearChrome(); window.scrollTo(0,0);

  app.innerHTML=`
   <div class="scorebox ${rank.toLowerCase()}" style="padding:24px;margin:18px 0">
     <div class="rk" style="font-size:44px">${rank}</div>
     <div class="dt"><b style="font-size:20px">平均網羅率 ${avg}%</b>
       <span>${done.length}問を記述しました</span></div>
   </div>

   <h2 class="sec">分野別の網羅率</h2>
   <div class="card"><div class="catlist">
     ${Object.entries(perCat).map(([c,rs])=>{
       const a=Math.round(rs.reduce((x,y)=>x+y,0)/rs.length);
       return `<div class="catrow" style="cursor:default">
         <span class="nm">${esc(c)}</span>
         <span class="bar"><i style="width:${a}%"></i></span>
         <span class="pc">${a}% <span style="color:var(--tx3);font-weight:600">(${rs.length}問)</span></span>
       </div>`;}).join("")}
   </div></div>

   <h2 class="sec">設問ごとの結果（タップで解説）</h2>
   <div class="card"><div class="setlist">
     ${done.map(i=>`<button class="setrow" onclick="review(${i})">
       <span class="mk ${res[i].rank.toLowerCase()}">${res[i].rank}</span>
       <span class="chip">${esc(list[i].c)}</span>
       <span class="qq">${esc(list[i].t)}　${esc(list[i].q).slice(0,32)}</span>
       <span class="tiny">${res[i].rate}%</span>
     </button>`).join("")}
   </div></div>

   <div class="row" style="justify-content:center;margin:24px 0 40px">
     <button class="btn" onclick="home()">ホームへ戻る</button>
     <button class="btn sub" onclick="screenHistory()">成績を見る</button>
   </div>`;
  window.__RES={list,res,ans};
}
let __resHTML=null;
function review(i){
  const {list,res,ans}=window.__RES, q=list[i];
  clearChrome(); window.scrollTo(0,0);
  app.innerHTML=`
   <div class="row" style="margin:16px 0 0"><button class="btn sub sm" onclick="backRes()">← 結果に戻る</button></div>
   <div class="card">
     <div class="qmeta"><span class="chip">${esc(q.c)}</span><span class="chip g">${esc(q.t)}</span></div>
     <div class="qtext">${esc(q.q)}</div>
     ${q.cond?`<div class="qcond"><b>［設計条件］</b>${esc(q.cond)}</div>`:""}
     ${resultHTML(q,ans[i]||"",res[i])}
   </div>
   <div class="row" style="justify-content:center;margin:20px 0 40px">
     <button class="btn sub" onclick="backRes()">結果に戻る</button></div>`;
}
function backRes(){ if(__resHTML){app.innerHTML=__resHTML;window.scrollTo(0,0);} else home(); }
const _finish=finish;
finish=function(){ _finish(); __resHTML=app.innerHTML; };

function screenHistory(){
  clearChrome(); window.scrollTo(0,0);
  const written=QB.filter(q=>DRAFT[q.id]);
  app.innerHTML=`
  <h2 class="sec">分野別の到達度</h2>

        <span class="nm">${c}</span><span class="bar"><i style="width:${av}%"></i></span>
        <span class="pc">${ds.length?av+"%":"—"} <span style="color:var(--tx3);font-weight:600">(${ds.length}/${qs.length})</span></span>
      </div>`;}).join("")}
  </div>
  <p class="tiny" style="margin-top:12px">網羅率は、各設問で過去に記録した最高値の平均です。</p></div>

  <h2 class="sec">実施履歴</h2>
  <div class="card">
    ${HIST.length?`<div class="catlist">${HIST.map(h=>`<div class="hrow">
      <span class="dt">${esc(h.date)}</span><span class="md">${esc(h.mode)}</span>
      <span class="sc">${h.n}問　${h.avg}%</span></div>`).join("")}</div>`

/* ============================================================
   ② エスキス検算・法規チェック
   ============================================================ */
const ZONES=["第一種低層住居専用地域","第二種低層住居専用地域","田園住居地域",
  "第一種中高層住居専用地域","第二種中高層住居専用地域",
  "第一種住居地域","第二種住居地域","準住居地域",
  "近隣商業地域","商業地域","準工業地域","工業地域","工業専用地域"];
const Z_LOW=ZONES.slice(0,3);                 // 絶対高さ制限のある地域
const Z_MID=ZONES.slice(3,5);                 // 中高層住居専用
const Z_JU =ZONES.slice(0,8);                 // 住居系
const Z_COM=["近隣商業地域","商業地域"];
const FLOORS=["B1","1","2","3","4","5","R"];

const ESQ_DEF={
  site:2000, zone:"第一種住居地域", bcr:60, far:200,
  road1:16, road2:6, corner:false, fire:"準防火地域", bldg:"耐火建築物等",
  setback:2, rinchiD:3, northD:5, absH:12,
  spanX:7, spanY:7, nX:6, nY:4, useGrid:true, bldArea:1000,
  rooms:[
    {nm:"エントランスホール",fl:"1",ar:200,kd:"算入"},
    {nm:"多目的ホール",fl:"1",ar:400,kd:"算入"},
    {nm:"事務室・管理部門",fl:"1",ar:150,kd:"算入"},
    {nm:"駐車場",fl:"1",ar:180,kd:"車庫"},
    {nm:"共用廊下・階段",fl:"1",ar:120,kd:"不算入"}
  ]
};
let ESQ = Object.assign({},ESQ_DEF,LS.get("seizu_esq",{}));
if(!Array.isArray(ESQ.rooms)||!ESQ.rooms.length) ESQ.rooms=ESQ_DEF.rooms.slice();
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const r1=v=>Math.round(v*10)/10;
const r0=v=>Math.round(v);

/* ---------- 法規計算の本体 ---------- */
function esqCalc(I){
  const S=num(I.site);
  const isJ=Z_JU.includes(I.zone), isLow=Z_LOW.includes(I.zone), isMid=Z_MID.includes(I.zone);
  const W=Math.max(num(I.road1),num(I.road2));

  /* 容積率 */
  const coef=isJ?0.4:0.6;
  const roadFAR = W>=12 ? Infinity : W*coef*100;
  const baseFAR = Math.min(num(I.far), roadFAR);
  const farBy = (roadFAR<num(I.far)) ? "前面道路" : "指定";
  const maxFloor = S*baseFAR/100;

  /* 建蔽率 */
  const fireOK  = (I.fire==="防火地域"   && I.bldg==="耐火建築物等");
  const qfireOK = (I.fire==="準防火地域" && (I.bldg==="耐火建築物等"||I.bldg==="準耐火建築物等"));
  let add=0, noLimit=false, notes=[];
  if(num(I.bcr)===80 && fireOK){ noLimit=true; notes.push("建蔽率80%の地域＋防火地域内の耐火建築物のため建蔽率の制限なし"); }
  else{
    if(fireOK){ add+=10; notes.push("防火地域内の耐火建築物で+10%"); }
    else if(qfireOK){ add+=10; notes.push("準防火地域内の耐火・準耐火建築物で+10%"); }
    if(I.corner){ add+=10; notes.push("角地指定で+10%"); }
  }
  const maxBCR = noLimit?100:Math.min(100,num(I.bcr)+add);
  const maxArea = S*maxBCR/100;

  /* 高さ制限 */
  const hs=[];
  if(isLow) hs.push({nm:"絶対高さ制限",v:num(I.absH),d:`${I.zone}のため${I.absH}mが上限`});
  const slope=isJ?1.25:1.5;
  const roadH=(W+2*num(I.setback))*slope;
  /* 道路斜線の適用距離（別表第3） */
  let ad;
  if(isJ)                     ad = baseFAR<=200?20 : baseFAR<=300?25 : baseFAR<=400?30 : 35;
  else if(Z_COM.includes(I.zone)) ad = baseFAR<=400?20 : baseFAR<=600?25 : baseFAR<=800?30 : baseFAR<=1000?35 : baseFAR<=1100?40 : baseFAR<=1200?45 : 50;
  else                        ad = baseFAR<=200?20 : baseFAR<=300?25 : baseFAR<=400?30 : 35;
  hs.push({nm:"道路斜線制限",v:roadH,
    d:`外壁位置での限度。(道路幅員${W}m + 後退${I.setback}m×2)×${slope}。適用距離${ad}m`});
  if(!isLow){
    const rs=isJ?1.25:2.5, rb=isJ?20:31;
    hs.push({nm:"隣地斜線制限",v:rb+rs*(num(I.rinchiD)+num(I.setback)),
      d:`立上り${rb}m＋勾配${rs}。隣地境界から${I.rinchiD}m、後退${I.setback}mで算定`});
  }
  if(isLow||isMid){
    const nb=isLow?5:10;
    hs.push({nm:"北側斜線制限",v:nb+1.25*num(I.northD),
      d:`立上り${nb}m＋勾配1.25。真北の隣地境界から${I.northD}mで算定`+(isMid?"（日影規制対象区域内では適用されない）":"")});
  }
  const minH=hs.reduce((a,b)=>b.v<a.v?b:a,hs[0]);

  /* 日影規制 */
  let shadow;
  if(["商業地域","工業地域","工業専用地域"].includes(I.zone)) shadow="対象区域として指定できない地域です。";
  else if(isLow) shadow="対象区域に指定されている場合、軒の高さ7m超 または 地階を除く階数3以上が規制対象です。測定面は平均地盤面から1.5m。";
  else shadow="対象区域に指定されている場合、高さ10m超が規制対象です。測定面は平均地盤面から4mまたは6.5m。";

  /* 面積の積算 */
  const rooms=I.rooms||[];
  const total=rooms.reduce((a,r)=>a+num(r.ar),0);
  const garage=rooms.filter(r=>r.kd==="車庫").reduce((a,r)=>a+num(r.ar),0);
  const excl=rooms.filter(r=>r.kd==="不算入").reduce((a,r)=>a+num(r.ar),0);
  const gLimit=total/5;
  const gExcl=Math.min(garage,gLimit);
  const farArea=total-excl-gExcl;
  const perFloor={};
  FLOORS.forEach(f=>perFloor[f]=0);
  rooms.forEach(r=>{ if(perFloor[r.fl]===undefined)perFloor[r.fl]=0; perFloor[r.fl]+=num(r.ar); });

  /* 建築面積 */
  const bld = I.useGrid ? num(I.spanX)*num(I.nX)*num(I.spanY)*num(I.nY) : num(I.bldArea);

  return {S,isJ,isLow,isMid,W,coef,roadFAR,baseFAR,farBy,maxFloor,
    maxBCR,maxArea,noLimit,notes,hs,minH,ad,shadow,
    total,garage,excl,gLimit,gExcl,farArea,perFloor,bld,
    bcrNow:S?bld/S*100:0, farNow:S?farArea/S*100:0};
}

function esqSet(k,v){ ESQ[k]=v; LS.set("seizu_esq",ESQ); esqUpdate(); }
function esqRoomSet(i,k,v){ ESQ.rooms[i][k]=v; LS.set("seizu_esq",ESQ); esqUpdate(); }
function esqAdd(){ ESQ.rooms.push({nm:"",fl:"1",ar:0,kd:"算入"}); LS.set("seizu_esq",ESQ); esqRooms(); esqUpdate(); }
function esqDel(i){ ESQ.rooms.splice(i,1); LS.set("seizu_esq",ESQ); esqRooms(); esqUpdate(); }
function esqReset(){
  if(!confirm("入力内容を初期状態に戻します。よろしいですか。")) return;
  ESQ=Object.assign({},ESQ_DEF); ESQ.rooms=ESQ_DEF.rooms.map(r=>Object.assign({},r));
  LS.set("seizu_esq",ESQ); screenEsq();
}
function esqRooms(){
  $("#esqRooms").innerHTML=ESQ.rooms.map((r,i)=>`<tr>
    <td><input value="${esc(r.nm)}" placeholder="室名" oninput="esqRoomSet(${i},'nm',this.value)"></td>
    <td><select onchange="esqRoomSet(${i},'fl',this.value)">${
        FLOORS.map(f=>`<option${f===r.fl?" selected":""}>${f}</option>`).join("")}</select></td>
    <td><input class="num" type="number" step="10" value="${r.ar}" oninput="esqRoomSet(${i},'ar',this.value)"></td>
    <td><select onchange="esqRoomSet(${i},'kd',this.value)">${
        ["算入","車庫","不算入"].map(k=>`<option${k===r.kd?" selected":""}>${k}</option>`).join("")}</select></td>
    <td><button class="del" onclick="esqDel(${i})" title="削除">×</button></td>
  </tr>`).join("");
}

function esqUpdate(){
  const R=esqCalc(ESQ);
  const gauge=(now,max,unit)=>{
    const p=max?Math.min(100,now/max*100):0;
    const cls = now>max?"ng" : p>=90?"wa" : "ok";
    return `<div class="gauge"><i class="${cls}" style="width:${p}%"></i>
      <span>${r0(now)} / ${r0(max)} ${unit}（${max?Math.round(now/max*100):0}%）</span></div>`;
  };

  /* 2. 上限 */
  $("#esqJudge").innerHTML=`<div class="card"><div class="jgrid">
    <div class="jcard">
      <div class="t">建蔽率の限度</div>
      <div class="v">${r1(R.maxBCR)}<small>%</small></div>
      <div class="d">${R.notes.length?R.notes.join("／"):"緩和の適用なし"}</div>
    </div>
    <div class="jcard">
      <div class="t">建築面積の上限</div>
      <div class="v">${r0(R.maxArea)}<small>㎡</small></div>
      <div class="d">敷地面積 ${r0(R.S)}㎡ × ${r1(R.maxBCR)}%</div>
    </div>
    <div class="jcard">
      <div class="t">容積率の限度</div>
      <div class="v">${R.baseFAR===Infinity?"—":r1(R.baseFAR)}<small>%</small></div>
      <div class="d">${R.farBy}による制限。前面道路 ${R.W}m
        ${R.W>=12?"（12m以上のため道路による制限なし）":`× ${R.coef}＝${r1(R.roadFAR)}%`}
        ／ 指定 ${num(ESQ.far)}%</div>
    </div>
    <div class="jcard">
      <div class="t">延べ面積（容積対象）の上限</div>
      <div class="v">${r0(R.maxFloor)}<small>㎡</small></div>
      <div class="d">敷地面積 ${r0(R.S)}㎡ × ${r1(R.baseFAR)}%</div>
    </div>
  </div></div>`;

  /* 3. 高さ */
  $("#esqHeight").innerHTML=`<div class="card">
    <div class="jgrid">
      ${R.hs.map(h=>`<div class="jcard${h===R.minH?" wa":""}">
        <div class="t">${esc(h.nm)}${h===R.minH?"（最も厳しい）":""}</div>
        <div class="v">${r1(h.v)}<small>m</small></div>
        <div class="d">${esc(h.d)}</div></div>`).join("")}
    </div>
    <div class="alert wa" style="margin-top:14px">
      この条件での高さの上限は <b>${r1(R.minH.v)}m</b>（${esc(R.minH.nm)}）です。
      階高4.0mなら ${Math.floor(R.minH.v/4)}階程度、階高4.5mなら ${Math.floor(R.minH.v/4.5)}階程度が目安になります。
    </div>
    <p class="tiny" style="margin-top:10px"><b>日影規制：</b>${esc(R.shadow)}</p>
  </div>`;

  /* 4. グリッド */
  const over=R.bld>R.maxArea;
  $("#esqGrid").innerHTML=`
    <div class="jgrid">
      <div class="jcard"><div class="t">建物の外形寸法</div>
        <div class="v" style="font-size:20px">${r1(num(ESQ.spanX)*num(ESQ.nX))} × ${r1(num(ESQ.spanY)*num(ESQ.nY))}<small>m</small></div>
        <div class="d">${ESQ.spanX}m×${ESQ.nX}コマ ／ ${ESQ.spanY}m×${ESQ.nY}コマ</div></div>
      <div class="jcard ${over?"ng":"ok"}"><div class="t">建築面積</div>
        <div class="v">${r0(R.bld)}<small>㎡</small></div>
        <div class="d">建蔽率 ${r1(R.bcrNow)}% ／ 限度 ${r1(R.maxBCR)}%</div></div>
    </div>
    ${gauge(R.bld,R.maxArea,"㎡")}
    ${over?`<div class="alert ng">建築面積が上限を ${r0(R.bld-R.maxArea)}㎡ 超過しています。コマ数を減らすか、スパンを見直してください。</div>`
          :`<div class="alert ok">建築面積に ${r0(R.maxArea-R.bld)}㎡ の余裕があります。</div>`}`;

  /* 5. 面積表 */
  const fl=FLOORS.filter(f=>R.perFloor[f]>0);
  const overF=R.farArea>R.maxFloor;
  $("#esqSum").innerHTML=`
    <h4 class="lbl">階別床面積</h4>
    <div class="tblwrap"><table class="rtbl" style="min-width:320px">
      <thead><tr><th>階</th><th style="text-align:right">床面積㎡</th><th style="text-align:right">構成比</th></tr></thead>

let DR = LS.get("seizu_drill",{cnt:0,ok:0,n:0,
  per:{bcr:[0,0],area:[0,0],far:[0,0],floor:[0,0],h:[0,0]}});
let DQ = null;   // 現在の出題 {I, R, ans, checked}

const DR_ITEMS=[
  {k:"bcr",  nm:"建蔽率の限度",            unit:"%",  tol:0.5, get:R=>R.maxBCR},
  {k:"area", nm:"建築面積の上限",          unit:"㎡", tol:1,   get:R=>R.maxArea},
  {k:"far",  nm:"容積率の限度",            unit:"%",  tol:0.5, get:R=>R.baseFAR},
  {k:"floor",nm:"延べ面積（容積対象）の上限",unit:"㎡", tol:1,   get:R=>R.maxFloor},
  {k:"h",    nm:"最も厳しい高さ制限",       unit:"m",  tol:0.15,get:R=>R.minH.v}
];

function drillGen(){
  const pick=a=>a[Math.random()*a.length|0];
  const zone=pick(["第一種低層住居専用地域","第一種中高層住居専用地域","第二種中高層住居専用地域",
    "第一種住居地域","第二種住居地域","準住居地域","近隣商業地域","商業地域","準工業地域"]);
  let bcr,far;
  if(Z_LOW.includes(zone)){ bcr=pick([50,60]); far=pick([80,100,150,200]); }
  else if(zone==="商業地域"){ bcr=80; far=pick([400,500,600,800]); }
  else if(zone==="近隣商業地域"){ bcr=80; far=pick([200,300,400]); }
  else if(zone==="準工業地域"){ bcr=60; far=pick([200,300]); }
  else { bcr=pick([60,60,80]); far=pick([200,300,400]); }
  return {
    site:(24+(Math.random()*38|0))*50,
    zone,bcr,far,
    road1:pick([4,6,8,10,12,16,20]),
    road2:Math.random()<0.5?pick([4,6,8]):0,
    fire:pick(["防火地域","準防火地域","指定なし"]),
    bldg:pick(["耐火建築物等","耐火建築物等","準耐火建築物等","その他"]),
    corner:Math.random()<0.35,
    setback:pick([0,1,2,3]),
    rinchiD:pick([2,3,4,5]),
    northD:pick([3,4,5,6]),
    absH:pick([10,12]),
    rooms:[],useGrid:false,bldArea:0,spanX:7,spanY:7,nX:0,nY:0
  };
}
function drillNew(){
  const I=drillGen();
  DQ={I,R:esqCalc(I),ans:{},checked:false};
  screenDrill();
}
function drillAns(k,v){ if(DQ) DQ.ans[k]=v; }
function drillCheck(){
  DR_ITEMS.forEach(it=>{ const el=$("#d_"+it.k); if(el) DQ.ans[it.k]=el.value; });
  const filled=DR_ITEMS.filter(it=>String(DQ.ans[it.k]??"").trim()!=="").length;
  if(!filled){ alert("いずれかの欄に計算結果を入力してから答え合わせをしてください。"); return; }
  DQ.checked=true;
  DR.n++;
  DR_ITEMS.forEach(it=>{
    const raw=String(DQ.ans[it.k]??"").trim();
    if(raw==="") return;
    const got=num(raw), exp=it.get(DQ.R);
    const ok=isFinite(exp)&&Math.abs(got-exp)<=it.tol;
    DR.cnt++; if(ok)DR.ok++;
    DR.per[it.k][1]++; if(ok)DR.per[it.k][0]++;
  });
  LS.set("seizu_drill",DR);
  screenDrill();
}
function drillClear(){
  if(!confirm("ドリルの成績を消去します。よろしいですか。")) return;
  DR={cnt:0,ok:0,n:0,per:{bcr:[0,0],area:[0,0],far:[0,0],floor:[0,0],h:[0,0]}};
  LS.set("seizu_drill",DR); screenDrill();
}

/* 計算過程の説明文を生成 */
function drillWhy(k,I,R){
  switch(k){
    case "bcr":
      return R.noLimit
        ? `指定建蔽率が80%の地域で、かつ防火地域内の耐火建築物のため、建蔽率の制限は適用されません（法第53条第6項第一号）。したがって100%。`
        : `指定 ${I.bcr}%${R.notes.length?"　＋　"+R.notes.join("　＋　"):"（緩和の適用なし）"}　→　${r1(R.maxBCR)}%`;
    case "area":
      return `敷地面積 ${r0(R.S)}㎡ × 建蔽率 ${r1(R.maxBCR)}% ＝ ${r0(R.maxArea)}㎡`;
    case "far":
      return R.W>=12
        ? `前面道路の幅員が ${R.W}m（12m以上）のため、道路による容積率の制限を受けません。したがって指定容積率 ${I.far}% がそのまま限度となります。`
        : `前面道路 ${R.W}m（2以上あるときは最大幅員）× ${R.coef}（${R.isJ?"住居系":"住居系以外"}）＝ ${r1(R.roadFAR)}%　vs　指定 ${I.far}%　→　小さい方の ${r1(R.baseFAR)}%`;
    case "floor":
      return `敷地面積 ${r0(R.S)}㎡ × 容積率 ${r1(R.baseFAR)}% ＝ ${r0(R.maxFloor)}㎡`;
    case "h":
      return R.hs.map(x=>`${x.nm}　${r1(x.v)}m　…　${x.d}`).join("<br>")
        +`<br><b>→ 最も厳しいのは ${R.minH.nm} の ${r1(R.minH.v)}m</b>`;
  }
  return "";
}

  {id:"sec", grp:"作図",  nm:"断面図",                   def:20, tip:"切断位置の指定を必ず確認。階高・天井高・GLの記入漏れに注意。"},
  {id:"fin", grp:"作図",  nm:"面積表・室名・寸法・仕上げ",def:45, tip:"面積表の未記入は致命傷。室名・寸法・ハッチングもここで一気に入れる。"},
  {id:"chk", grp:"確認",  nm:"見直し・未記入チェック",    def:35, tip:"要求図書の欠落、面積表の整合、法規の再確認。最後の30分は必ず残す。"}
];
const PHi=id=>PH.find(p=>p.id===id);
const TM_MODES={
  full:{nm:"通し（本試験と同じ6時間30分）",ids:PH.map(p=>p.id)},
  draw:{nm:"作図フェーズのみ",            ids:["axis","p1","p2","p3","sec","fin"]},
  esq: {nm:"読み取り＋エスキス＋記述のみ",ids:["read","esq","note"]}
};
let TMP = LS.get("seizu_tmplan", Object.fromEntries(PH.map(p=>[p.id,p.def])));
let TMS = LS.get("seizu_tmstart","11:00");
let TMH = LS.get("seizu_tmhist",[]);
let TM=null, tmTick=null;

const planOf=id=>num(TMP[id])||PHi(id).def;
const sumPlan=ids=>ids.reduce((a,b)=>a+planOf(b),0);
const hhmm=(base,addMin)=>{
  const [h,m]=String(base).split(":").map(Number);
  const t=new Date(2000,0,1,h||0,m||0); t.setMinutes(t.getMinutes()+addMin);
  return String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
};
const hms=s=>{s=Math.max(0,Math.round(s));const h=s/3600|0,m=(s%3600)/60|0,x=s%60;
  return (h?h+":"+String(m).padStart(2,"0"):String(m))+":"+String(x).padStart(2,"0");};
const signed=v=>(v>0?"+":"")+Math.round(v);
const median=a=>{if(!a.length)return 0;const b=a.slice().sort((x,y)=>x-y);const i=b.length>>1;
  return b.length%2?b[i]:Math.round((b[i-1]+b[i])/2);};

          <td style="text-align:right;font-variant-numeric:tabular-nums"><b>${std.med[p.id]}分</b></td>
          <td style="text-align:right"><span class="diff ${d>0?"plus":d<0?"minus":""}">${d===0?"±0":signed(d)}分</span></td></tr>`;}).join("")}
      </tbody>
    </table></div>
    ${std.drawCount?`<div class="alert ${std.drawMed<=sumPlan(TM_MODES.draw.ids)?"ok":"wa"}" style="margin-top:14px">
      作図フェーズの実測合計は <b>${std.drawMed}分</b>（時間割 ${sumPlan(TM_MODES.draw.ids)}分）。

        ? `想定より ${sumPlan(TM_MODES.draw.ids)-std.drawMed}分 速いので、その分をエスキスに回せます。作図時間が読めていること自体が強みです。`
        : std.drawMed===sumPlan(TM_MODES.draw.ids)
        ? `時間割どおりです。この所要時間を前提に、残りをエスキスと見直しに配分できます。`
        : `想定より ${std.drawMed-sumPlan(TM_MODES.draw.ids)}分 かかっています。この実測値を前提に、エスキスの持ち時間を見直してください。`}
    </div>`:""}
    <div class="row" style="margin-top:14px">
      <button class="btn sm" onclick="tmApply()">この実測値を時間割に反映する</button>

    </div>
  </div>`:`
  <div class="notice">
    通しまたは作図のみで1回計測すると、ここに<b>あなたの標準時間</b>が表示されます。
    3回以上溜めると中央値が安定し、時間割に反映できるようになります。
  </div>`}

  ${TMH.length?`<h2 class="sec">実施履歴</h2>
  <div class="card"><div class="steps">
    ${TMH.map((h,i)=>`<button class="step" style="cursor:pointer" onclick="tmHist(${i})">
      <span class="t"><b>${esc(h.date)}</b><br><span class="tiny">${esc(h.mode)}</span></span>
      <span class="m">予定${h.plan}分 → 実績<b>${h.total}分</b>
        <span class="diff ${h.total>h.plan?"plus":"minus"}">${signed(h.total-h.plan)}</span></span>
    </button>`).join("")}
  </div>
  <div class="row" style="margin-top:14px"><button class="btn sub sm" onclick="tmClear()">履歴を消去</button></div>
  </div>`:""}

  <div class="notice">
    <b>作図フェーズの使い方</b><br>
    作図中は手が塞がっていて画面を見られません。計測中の画面は、残り時間・次の工程・締切時刻・遅れだけを大きく表示します。
    端末を机の端に置いてときどき目をやり、工程が終わったら「完了」を押すだけで使えます。
    通しで6時間30分を確保できる日は限られるので、実測を溜めるには「作図フェーズのみ」モードが現実的です。
  </div>
  <div class="row" style="justify-content:center;margin:24px 0 40px">
    <button class="btn sub" onclick="home()">ホームへ戻る</button>
  </div>`;
}

function tmStandard(){
  const acc={}; let count=0, draws=[];
  TMH.forEach(h=>{
    count++;
    Object.entries(h.act||{}).forEach(([k,v])=>{ (acc[k]=acc[k]||[]).push(v); });
    const d=TM_MODES.draw.ids.filter(id=>h.act&&h.act[id]!==undefined);
    if(d.length===TM_MODES.draw.ids.length) draws.push(d.reduce((a,id)=>a+h.act[id],0));
  });
  const med={}; Object.entries(acc).forEach(([k,v])=>med[k]=median(v));
  return {count,med,drawCount:draws.length,drawMed:median(draws)};
}
function tmApply(){
  const std=tmStandard();
  if(!std.count){ alert("実測データがありません。"); return; }
  if(!confirm("実測の中央値を時間割に反映します。よろしいですか。")) return;
  Object.entries(std.med).forEach(([k,v])=>{ if(v>0) TMP[k]=v; });
  LS.set("seizu_tmplan",TMP); screenTm();
}
function tmReset(){
  if(!confirm("時間割を標準（合計390分）に戻します。よろしいですか。")) return;
  TMP=Object.fromEntries(PH.map(p=>[p.id,p.def])); LS.set("seizu_tmplan",TMP); screenTm();
}
function tmClear(){
  if(!confirm("計測の履歴をすべて消去します。よろしいですか。")) return;
  TMH=[]; LS.set("seizu_tmhist",[]); screenTm();
}

/* ---------- 計測 ---------- */
function tmStart(mode){
  const ids=TM_MODES[mode].ids;
  TM={mode,modeNm:TM_MODES[mode].nm,ids,idx:0,act:{},
      t0:Date.now(),p0:Date.now(),paused:false,pauseAt:0,pausedMs:0};
  tmLoop(); tmRender();
}
function tmLoop(){
  if(tmTick)clearInterval(tmTick);
  tmTick=setInterval(()=>{ if(TM&&!TM.paused) tmFace(); },1000);
}
function tmStop(){ if(tmTick){clearInterval(tmTick);tmTick=null;} }
function tmElapsed(){ return TM.paused ? TM.pauseAt-TM.p0-TM.pausedMs : Date.now()-TM.p0-TM.pausedMs; }

function tmRender(){
  window.scrollTo(0,0);
  const ids=TM.ids;
  app.innerHTML=`
   <div class="card" style="padding:0;overflow:hidden">
     <div class="tmrun" id="tmFace"></div>
     <div style="padding:0 20px 20px">
       <button class="tmbtn" id="tmNext" onclick="tmDone()"></button>
       <div class="row" style="margin-top:10px;justify-content:center">
         <button class="btn sub sm" onclick="tmPause()" id="tmPa">一時停止</button>
         <button class="btn sub sm" onclick="tmAbort()">中断する</button>
       </div>
     </div>
   </div>
   <h2 class="sec">工程</h2>
   <div class="card"><div class="steps" id="tmSteps"></div></div>`;
  tmFace();
}
function tmFace(){
  if(!TM||!$("#tmFace")) return;
  const ids=TM.ids, i=TM.idx, id=ids[i], p=PHi(id);
  const planSec=planOf(id)*60;
  const el=tmElapsed()/1000;
  const left=planSec-el;
  const cls = left<=0?"danger" : left<=300?"warn" : "";

  const actBefore=ids.slice(0,i).reduce((a,x)=>a+(TM.act[x]||0),0);
  const planBefore=sumPlan(ids.slice(0,i));
  const lagCum=Math.round(actBefore-planBefore);   // 完了済み工程までの遅れ（＋）／貯金（−）
  const totalPlan=sumPlan(ids);
  const totalUsed=actBefore+el/60;
  const endClock=hhmm(TMS,planBefore+planOf(id));
  const next=ids[i+1]?PHi(ids[i+1]).nm:null;

  $("#tmFace").innerHTML=`
    <div class="grp">${esc(p.grp)}　${i+1} / ${ids.length}</div>
    <div class="ph">${esc(p.nm)}</div>
    <div class="big ${cls}">${left>=0?hms(left):"−"+hms(-left)}</div>
    <div class="sub">この工程の予定 ${planOf(id)}分　／　締切 ${endClock}</div>
    <div class="sub" style="margin-top:6px;color:var(--tx3)">
      全体 ${Math.round(totalUsed)} / ${totalPlan}分　残り ${Math.max(0,Math.round(totalPlan-totalUsed))}分</div>
    ${i>0?`<div class="lag ${lagCum>0?"ng":"ok"}">${lagCum>0?`前工程まで ${lagCum}分 遅れ`:lagCum<0?`前工程まで ${-lagCum}分 貯金`:"予定どおり"}</div>`:""}
    ${next?`<div class="sub" style="margin-top:12px;color:var(--tx3)">次：${esc(next)}</div>`:
            `<div class="sub" style="margin-top:12px;color:var(--tx3)">これが最後の工程です</div>`}`;
  $("#tmNext").textContent = ids[i+1]?"この工程を完了して次へ":"完了して結果を見る";
  $("#tmNext").className = "tmbtn"+(ids[i+1]?"":" fin");
  $("#tmPa").textContent = TM.paused?"再開する":"一時停止";

  $("#tmSteps").innerHTML=ids.map((x,j)=>{
    const q=PHi(x);
    const st=j<i?"done":j===i?"now":"";
    const clock=hhmm(TMS,sumPlan(ids.slice(0,j+1)));
    return `<div class="step ${st}">
      <span class="chip g" style="min-width:52px;text-align:center">${esc(q.grp)}</span>
      <span class="t">${esc(q.nm)}</span>
      <span class="m">${j<i?`<b>${TM.act[x]}分</b> <span class="diff ${TM.act[x]>planOf(x)?"plus":"minus"}">${signed(TM.act[x]-planOf(x))}</span>`
        :`${planOf(x)}分 ／ ${clock}`}</span></div>`;}).join("");
}
function tmPause(){
  if(!TM)return;
  if(TM.paused){ TM.pausedMs+=Date.now()-TM.pauseAt; TM.paused=false; }
  else { TM.pauseAt=Date.now(); TM.paused=true; }
  tmFace();
}
function tmDone(){
  if(!TM)return;
  const id=TM.ids[TM.idx];
  TM.act[id]=Math.max(1,Math.round(tmElapsed()/60000));
  if(TM.idx<TM.ids.length-1){
    TM.idx++; TM.p0=Date.now(); TM.pausedMs=0; TM.paused=false; tmFace(); window.scrollTo(0,0);
  } else tmFinish();
}
function tmAbort(){
  if(!confirm("計測を中断します。ここまでの記録は保存されません。よろしいですか。")) return;
  tmStop(); TM=null; screenTm();
}
function tmFinish(){
  tmStop();
  const ids=TM.ids, act=TM.act;
  const total=ids.reduce((a,x)=>a+(act[x]||0),0);
  const plan=sumPlan(ids);
  TMH.unshift({date:new Date().toLocaleString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}),
    mode:TM.modeNm,ids,act,total,plan});
  TMH=TMH.slice(0,50); LS.set("seizu_tmhist",TMH);
  TM=null; tmResult(0);
}
function tmHist(i){ tmResult(i); }
function tmResult(i){
  clearChrome(); window.scrollTo(0,0);
  const h=TMH[i]; if(!h){ screenTm(); return; }
  const over=h.total>h.plan;
  app.innerHTML=`
   <div class="scorebox ${over?"b":"a"}" style="padding:24px;margin:18px 0">
     <div class="rk" style="font-size:40px">${over?"超過":"完了"}</div>
     <div class="dt"><b style="font-size:20px">実績 ${h.total}分 ／ 予定 ${h.plan}分</b>
       <span>${esc(h.mode)}　${over?`予定を ${h.total-h.plan}分 超過`:`予定より ${h.plan-h.total}分 短縮`}</span></div>
   </div>

   <h2 class="sec">工程別の実績</h2>
   <div class="card"><div class="tblwrap"><table class="rtbl" style="min-width:430px">
     <thead><tr><th>工程</th><th style="text-align:right">予定</th>
       <th style="text-align:right">実績</th><th style="text-align:right">差</th></tr></thead>
     <tbody>${h.ids.map(x=>{const d=(h.act[x]||0)-planOf(x);
       return `<tr><td>${esc(PHi(x).nm)}</td>
         <td style="text-align:right;font-variant-numeric:tabular-nums">${planOf(x)}分</td>
         <td style="text-align:right;font-variant-numeric:tabular-nums"><b>${h.act[x]||0}分</b></td>
         <td style="text-align:right"><span class="diff ${d>0?"plus":d<0?"minus":""}">${d===0?"±0":signed(d)}分</span></td></tr>`;}).join("")}
     </tbody>
     <tfoot><tr><td>合計</td>
       <td style="text-align:right">${h.plan}分</td>
       <td style="text-align:right"><b>${h.total}分</b></td>
       <td style="text-align:right"><span class="diff ${over?"plus":"minus"}">${signed(h.total-h.plan)}分</span></td></tr></tfoot>
   </table></div>
   <p class="tiny" style="margin-top:12px">
     差がプラスの工程が、あなたの実力に対して時間割が短すぎる工程です。
     何回か計測すると中央値が安定するので、工程タイマーの画面から時間割へ反映できます。</p>
   </div>

   <div class="row" style="justify-content:center;margin:24px 0 40px">
     <button class="btn" onclick="screenTm()">タイマー画面へ</button>
     <button class="btn sub" onclick="home()">ホームへ戻る</button>
   </div>`;
}

const CK_CATS=[...new Set(CK.map(x=>x.c))];
const LVNM={f:"致命",m:"重大",s:"確認"};
let CKS = LS.get("seizu_ck",{chk:{},rec:{}});
let CKmode = "list";   // list | fatal | recall
let RC_i=0, RC_show=false;

function ckToggle(i){ CKS.chk[i]=!CKS.chk[i]; LS.set("seizu_ck",CKS); screenCk(); }
function ckClear(){
  if(!confirm("チェックをすべて外します。よろしいですか。")) return;
  CKS.chk={}; LS.set("seizu_ck",CKS); screenCk();
}
function ckSetMode(m){ CKmode=m; RC_i=0; RC_show=false; screenCk(); }

function screenCk(){
  clearChrome(); window.scrollTo(0,0);
  const items=CKmode==="fatal"?CK.map((x,i)=>({x,i})).filter(o=>o.x.lv==="f"):CK.map((x,i)=>({x,i}));
  const done=items.filter(o=>CKS.chk[o.i]).length;
  const fatal=CK.map((x,i)=>({x,i})).filter(o=>o.x.lv==="f");
  const fatalLeft=fatal.filter(o=>!CKS.chk[o.i]).length;

  const tabs=`<div class="row" style="margin-bottom:16px">
    ${[["list","全項目"],["fatal","致命項目のみ"],["recall","想起テスト"]].map(([k,n])=>
      `<button class="btn ${CKmode===k?"":"sub"} sm" onclick="ckSetMode('${k}')">${n}</button>`).join("")}
  </div>`;

  if(CKmode==="recall"){ app.innerHTML=ckHero()+tabs+ckRecall(); return; }

  const cats=CKmode==="fatal"?CK_CATS.filter(c=>fatal.some(o=>o.x.c===c)):CK_CATS;
  app.innerHTML=ckHero()+tabs+`
   <div class="card">
     <div class="bigcount">
       <div class="${done===items.length?"ok":""}"><b>${done}/${items.length}</b><span>チェック済み</span></div>
       <div class="${fatalLeft?"ng":"ok"}"><b>${fatalLeft}</b><span>致命項目の未確認</span></div>
       <div><b>${Math.round(done/items.length*100)}%</b><span>進捗</span></div>
     </div>
     ${fatalLeft===0&&done===items.length
       ? `<div class="alert ok" style="margin-top:14px">すべて確認できました。提出して問題ありません。</div>`
       : fatalLeft
       ? `<div class="alert ng" style="margin-top:14px">一発失格につながる致命項目が ${fatalLeft} 件未確認です。他を後回しにしてでも先に確認してください。</div>`
       : `<div class="alert wa" style="margin-top:14px">致命項目はすべて確認済みです。残り ${items.length-done} 件を時間の許す範囲で確認してください。</div>`}
     <div class="row" style="margin-top:14px"><button class="btn sub sm" onclick="ckClear()">チェックをすべて外す</button></div>
   </div>

   ${cats.map(c=>{
     const li=items.filter(o=>o.x.c===c);
     if(!li.length) return "";
     const d=li.filter(o=>CKS.chk[o.i]).length;
     return `<div class="ckhead"><h3>${esc(c)}</h3><span class="n">${d}/${li.length}</span></div>
      <div class="cklist">
        ${li.map(o=>`<button class="ckitem ${CKS.chk[o.i]?"on":""}" onclick="ckToggle(${o.i})">
          <span class="bx">✓</span>
          <span class="bd"><b>${esc(o.x.t)}</b><span class="d">${esc(o.x.d)}</span></span>
          <span class="lv ${o.x.lv}">${LVNM[o.x.lv]}</span>
        </button>`).join("")}
      </div>`;}).join("")}

   <div class="notice">
     <b>本番での使い方</b><br>
     試験中にこのアプリは使えません。本番では見直しの30分に、この順番を<b>頭の中で回します</b>。
     そのために「想起テスト」でカテゴリ名だけから項目を思い出す練習をしてください。
     練習課題を解くときは、このチェックモードで実際に1項目ずつ潰していくと、順番が身体に入ります。
   </div>
   <div class="row" style="justify-content:center;margin:24px 0 40px">
     <button class="btn sub" onclick="home()">ホームへ戻る</button>
   </div>`;
}
function ckHero(){
  const f=CK.filter(x=>x.lv==="f").length;
  return `<div class="hero" style="background:linear-gradient(135deg,#4a1f1f 0%,#6b2f2a 60%,#8c4038 100%)">
    <h1>提出前チェックリスト</h1>
    <p>ランクⅣ（一発失格）の主因は、未完・要求室の欠落・法令への重大な不適合です。<br>
       最後の30分で確実に潰すための${CK.length}項目。うち${f}項目が致命的です。</p>
  </div>`;
}

/* ---------- 想起テスト ---------- */
function ckRecall(){
  const c=CK_CATS[RC_i], li=CK.filter(x=>x.c===c);
  const rec=CKS.rec[c]||[0,0];
  return `
  <div class="card">
    <div class="qmeta"><span class="qno">カテゴリ ${RC_i+1} / ${CK_CATS.length}</span>
      <span class="chip">${esc(c)}</span>
      ${rec[1]?`<span class="chip g">前回 ${rec[0]}/${li.length}</span>`:""}</div>
    <div class="qtext">「${esc(c)}」について、提出前に確認すべき項目を思い出してください。</div>
    <div class="qcond">このカテゴリには <b>${li.length}項目</b> あります（うち致命 ${li.filter(x=>x.lv==="f").length}項目）。
      紙に書き出すか、声に出して挙げてから答えを見てください。</div>

    ${RC_show?`
      <h4 class="lbl">答え</h4>
      <div class="cklist">
        ${li.map(x=>`<div class="ckitem" style="cursor:default">
          <span class="bx" style="border-color:var(--line);color:var(--tx3);background:transparent">✓</span>
          <span class="bd"><b style="text-decoration:none;opacity:1">${esc(x.t)}</b>
            <span class="d">${esc(x.d)}</span></span>
          <span class="lv ${x.lv}">${LVNM[x.lv]}</span></div>`).join("")}
      </div>
      <h4 class="lbl">いくつ思い出せましたか</h4>
      <div class="row" style="align-items:center">
        <input id="rc_n" type="number" min="0" max="${li.length}" value="${li.length}"
          style="width:88px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
                 background:var(--panel2);color:var(--tx);font-family:inherit;font-size:16px;
                 text-align:center;font-weight:800">
        <span class="muted">／ ${li.length}項目</span>
        <span style="flex:1"></span>
        <button class="btn sm" onclick="ckRecScore()">記録して次へ</button>
      </div>`
    :`<div class="row" style="margin-top:16px">
        <button class="btn" onclick="RC_show=true;screenCk()">答えを見る</button>
        <button class="btn sub" onclick="ckRecNext()">このカテゴリを飛ばす</button>
      </div>`}
  </div>

  ${Object.keys(CKS.rec).length?`
  <h2 class="sec">カテゴリ別の想起率</h2>
  <div class="card"><div class="catlist">
    ${CK_CATS.map(c2=>{const r=CKS.rec[c2],n=CK.filter(x=>x.c===c2).length;
      const p=r?Math.round(r[0]/n*100):0;
      return `<div class="catrow" style="cursor:default">
        <span class="nm" style="min-width:130px">${esc(c2)}</span>
        <span class="bar"><i style="width:${p}%"></i></span>
        <span class="pc">${r?p+"%":"—"} <span style="color:var(--tx3);font-weight:600">(${r?r[0]:0}/${n})</span></span>
      </div>`;}).join("")}
  </div></div>`:""}

  <div class="notice">
    カテゴリ名だけを手がかりに項目を挙げられるようになれば、本番でも同じ手順を再現できます。
    想起率が低いカテゴリは、チェックモードで読み返してから再挑戦してください。
  </div>
  <div class="row" style="justify-content:center;margin:24px 0 40px">
    <button class="btn sub" onclick="home()">ホームへ戻る</button>
  </div>`;
}
function ckRecScore(){
  const c=CK_CATS[RC_i], max=CK.filter(x=>x.c===c).length;
  const n=Math.min(max,Math.max(0,Math.round(num($("#rc_n").value))));
  CKS.rec[c]=[n,(CKS.rec[c]?CKS.rec[c][1]:0)+1];
  LS.set("seizu_ck",CKS); ckRecNext();
}
function ckRecNext(){
  RC_show=false;
  if(RC_i<CK_CATS.length-1){ RC_i++; screenCk(); }
  else { RC_i=0; screenCk(); alert("全カテゴリを一巡しました。想起率の低いカテゴリを読み返してください。"); }
}

  LS.set("seizu_esq",ESQ);
  screenEsq();
  setTimeout(()=>alert(`${K.nm}「${K.sub}」の条件を読み込みました。容積率・建蔽率の判定を確認してください。`),80);
}
function kadaiNote(){
  const K=KADAI[KAi];
